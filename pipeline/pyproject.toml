[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duk"
version = "0.1.0"
description = "Content pipeline: annotate, validate, synthesise, build content.db"
requires-python = ">=3.11"
dependencies = [
  "ToJyutping>=3.2",
  "pycantonese>=5.0",
  "pypinyin>=0.55",
  "opencc>=1.1",
  "jieba>=0.42",
  "pyyaml>=6",
  "requests>=2.31",
  "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
duk = "duk.cli:main"

[tool.setuptools.packages.find]
include = ["duk*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline YAML fixtures with CJK text
