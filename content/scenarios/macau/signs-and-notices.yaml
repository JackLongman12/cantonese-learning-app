# Drafted by an LLM. Every line stays reviewed: false until the owner has read it aloud
# and confirmed both the wording and the readings in build/review_queue.md.
scenario:
  id: scn-mo-signs
  title: Signs and notices
  region: macau
  tags: [signs, written]

