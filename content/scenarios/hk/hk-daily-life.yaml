  - {id: sent-hk-daily-069, yue: 幾時可以攞？, en: "When can I collect it?", pattern: errand}
  - {id: sent-hk-daily-070, yue: 我要去影證件相。, en: "I need to get ID photos taken.", pattern: errand}
