# Hong Kong daily life: the commute, cha chaan teng breakfasts, the convenience store,
# living in a building, malls, errands, weekends, weather talk, queues, neighbours and
# evenings at home. General statements only: no prices, routes or opening hours (those
# must come from a listed source, CLAUDE.md rule 3).
# Drafted by an LLM; the owner accepted LLM content as-is on 2026-11-16.
scenario:
  id: scn-hk-daily
  title: Hong Kong daily life
  region: hk
  tags: [daily, hk]

defaults: {register: spoken, source: llm, region: hk}

sentences:
  # --- the commute ------------------------------------------------------------------
  - {id: sent-hk-daily-001, yue: 今朝好迫，我等咗三班車先上到。, en: "It was packed this morning; I waited for three trains before I got on.", pattern: commute}
  - {id: sent-hk-daily-002, yue: 我每日搭港鐵返工。, en: "I take the MTR to work every day.", pattern: commute}
  - {id: sent-hk-daily-003, yue: 你返工要搭幾耐車？, en: "How long is your commute?", pattern: commute}
  - {id: sent-hk-daily-004, yue: 大概四十五分鐘，要轉一次車。, en: "About forty-five minutes, with one change.", pattern: commute}
  - {id: sent-hk-daily-005, yue: 今日遲咗出門口，要搭的士。, en: "I left late today, so I have to take a taxi.", pattern: commute}
  - {id: sent-hk-daily-006, yue: 落雨天啲人都唔想出街。, en: "On rainy days nobody wants to go out.", pattern: commute}
  - {id: sent-hk-daily-007, yue: 我喺車上面通常聽歌。, en: "I usually listen to music on the train.", pattern: commute}
  - {id: sent-hk-daily-008, yue: 車廂入面好多人瞓覺。, en: "Lots of people sleep in the carriage.", pattern: commute}
  - {id: sent-hk-daily-009, yue: 唔該借借，我落車。, en: "Excuse me, I'm getting off.", pattern: commute}
  - {id: sent-hk-daily-010, yue: 唔好企喺門口，入啲啦。, en: "Don't stand by the door, move in a bit.", pattern: commute}
  # --- cha chaan teng --------------------------------------------------------------
  - {id: sent-hk-daily-011, yue: 早晨！老樣，唔該。, en: "Morning! The usual, please.", pattern: cafe}
  - {id: sent-hk-daily-012, yue: 一個早餐，凍奶茶少甜。, en: "One breakfast set, iced milk tea, less sweet.", pattern: cafe}
  - {id: sent-hk-daily-013, yue: 有冇位呀？, en: "Any seats?", pattern: cafe}
  - {id: sent-hk-daily-014, yue: 搭枱得唔得？, en: "OK to share a table?", pattern: cafe, notes: "搭枱: sharing a table with strangers, normal at busy times."}
  - {id: sent-hk-daily-015, yue: 唔該埋單。, en: "The bill, please.", pattern: cafe}
  - {id: sent-hk-daily-016, yue: 呢度可唔可以用八達通俾錢？, en: "Can I pay by Octopus here?", pattern: cafe}
  - {id: sent-hk-daily-017, yue: 外賣，唔該。, en: "Takeaway, please.", pattern: cafe}
  - {id: sent-hk-daily-018, yue: 走冰，唔該。, en: "No ice, please.", pattern: cafe, notes: "走 means 'without': 走冰 no ice, 走甜 no sugar."}
  - {id: sent-hk-daily-019, yue: 茶餐廳啲伙計講嘢好快。, en: "Cha chaan teng waiters talk really fast.", pattern: cafe}
  - {id: sent-hk-daily-020, yue: 午飯時間成日排長龍。, en: "There's always a long queue at lunchtime.", pattern: cafe, fix_yue: {長: coeng4}}
  # --- the convenience store and paying --------------------------------------------
  - {id: sent-hk-daily-021, yue: 我去便利店買支水。, en: "I'm going to the convenience store for a bottle of water.", pattern: pay}
  - {id: sent-hk-daily-022, yue: 八達通冇錢喇，要增值。, en: "My Octopus is out of money; I need to top up.", pattern: pay}
  - {id: sent-hk-daily-023, yue: 可唔可以用手機俾錢？, en: "Can I pay with my phone?", pattern: pay}
  - {id: sent-hk-daily-024, yue: 我冇散紙，用卡得唔得？, en: "I don't have change; can I use a card?", pattern: pay}
  - {id: sent-hk-daily-025, yue: 要唔要膠袋？, en: "Do you want a plastic bag?", pattern: pay}
  - {id: sent-hk-daily-026, yue: 唔使膠袋，唔該。, en: "No bag, thanks.", pattern: pay}
  - {id: sent-hk-daily-027, yue: 膠袋要另外俾錢。, en: "Plastic bags cost extra.", pattern: pay}
  - {id: sent-hk-daily-028, yue: 收據要唔要？, en: "Do you want the receipt?", pattern: pay}
  - {id: sent-hk-daily-029, yue: 你哋幾點關門？, en: "What time do you close?", pattern: pay}
  - {id: sent-hk-daily-030, yue: 呢間二十四小時都開。, en: "This one's open twenty-four hours.", pattern: pay}
  # --- the building and the flat ---------------------------------------------------
  - {id: sent-hk-daily-031, yue: 我住喺屋邨，住咗好多年喇。, en: "I live on a public housing estate; I've been here for years.", pattern: building}
  - {id: sent-hk-daily-032, yue: 部𨋢又壞咗，要行樓梯。, en: "The lift's broken again; I have to take the stairs.", pattern: building}
  - {id: sent-hk-daily-033, yue: 保安叔叔同我打招呼。, en: "The security guard says hello to me.", pattern: building}
  - {id: sent-hk-daily-034, yue: 有你嘅速遞，放咗喺管理處。, en: "There's a delivery for you; it's at the management office.", pattern: building}
  - {id: sent-hk-daily-035, yue: 垃圾要拎去垃圾房。, en: "Rubbish goes to the refuse room.", pattern: building}
  - {id: sent-hk-daily-036, yue: 我屋企好細，得一間房。, en: "My flat is tiny, just one bedroom.", pattern: building}
  - {id: sent-hk-daily-037, yue: 香港啲樓好貴。, en: "Flats in Hong Kong are really expensive.", pattern: building}
  - {id: sent-hk-daily-038, yue: 樓上成日好嘈。, en: "Upstairs is always noisy.", pattern: building}
  - {id: sent-hk-daily-039, yue: 回南天，地下好濕。, en: "It's the damp season; the floor is wet.", pattern: building, notes: "回南天: the humid spells in spring when walls and floors sweat."}
  - {id: sent-hk-daily-040, yue: 開抽濕機啦，啲衫唔乾。, en: "Turn on the dehumidifier; the clothes won't dry.", pattern: building}
  - {id: sent-hk-daily-041, yue: 夏天唔開冷氣真係頂唔順。, en: "In summer I really can't stand it without aircon.", pattern: building}
  - {id: sent-hk-daily-042, yue: 今個月電費好貴。, en: "This month's electricity bill is high.", pattern: building}
  - {id: sent-hk-daily-043, yue: 個水喉漏水，要搵人整。, en: "The tap is leaking; I need to get someone to fix it.", pattern: building}
  - {id: sent-hk-daily-044, yue: 我哋棟大廈今日洗水缸，冇水用。, en: "Our building is cleaning the water tank today, so there's no water.", pattern: building}
  # --- malls and shops -------------------------------------------------------------
  - {id: sent-hk-daily-045, yue: 我哋去商場行吓啦。, en: "Let's go for a wander round the mall.", pattern: mall}
  - {id: sent-hk-daily-046, yue: 商場有冷氣，好舒服。, en: "The mall has aircon; it's comfortable.", pattern: mall}
  - {id: sent-hk-daily-047, yue: 呢間舖頭減緊價。, en: "This shop is having a sale.", pattern: mall}
  - {id: sent-hk-daily-048, yue: 有冇大啲嘅碼？, en: "Do you have a bigger size?", pattern: mall}
  - {id: sent-hk-daily-049, yue: 我可唔可以試吓？, en: "Can I try it on?", pattern: mall}
  - {id: sent-hk-daily-050, yue: 試身室喺邊？, en: "Where's the fitting room?", pattern: mall}
  - {id: sent-hk-daily-051, yue: 呢件衫幾錢？, en: "How much is this top?", pattern: mall}
  - {id: sent-hk-daily-052, yue: 我睇吓先，唔該。, en: "I'm just looking, thanks.", pattern: mall}
  - {id: sent-hk-daily-053, yue: 可唔可以退貨？, en: "Can I return it?", pattern: mall}
  - {id: sent-hk-daily-054, yue: 有單據先可以換。, en: "You can only exchange it with the receipt.", pattern: mall}
  - {id: sent-hk-daily-055, yue: 個個週末商場都好多人。, en: "The mall is crowded every weekend.", pattern: mall}
  - {id: sent-hk-daily-056, yue: 我約咗朋友喺旺角食飯。, en: "I'm meeting a friend in Mong Kok for dinner.", pattern: mall}
  - {id: sent-hk-daily-057, yue: 銅鑼灣人太多，我哋去第二度啦。, en: "Causeway Bay is too crowded; let's go somewhere else.", pattern: mall}
  # --- errands ---------------------------------------------------------------------
  - {id: sent-hk-daily-058, yue: 我要去銀行攞錢。, en: "I need to go to the bank to get cash.", pattern: errand}
  - {id: sent-hk-daily-059, yue: 附近有冇櫃員機？, en: "Is there an ATM nearby?", pattern: errand}
