  - id: sent-food-009
    yue: 糯米雞好飽肚。
    en: "Lo mai gai is very filling."
    tags: [yum-cha]
  - id: sent-food-010
    yue: 我最鍾意食流沙包。
    en: "Custard lava buns are my favourite."
    tags: [yum-cha]
  - id: sent-food-011
    yue: 春卷炸得好脆。
    en: "The spring rolls are fried nice and crispy."
    tags: [yum-cha]
  - id: sent-food-012
    yue: 豉汁排骨好送飯。
    en: "Spare ribs in black bean sauce go great with rice."
    tags: [yum-cha]
