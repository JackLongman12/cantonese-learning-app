    yue: 腸粉要牛肉定蝦？
    en: "Beef or shrimp rice rolls?"
    tags: [yum-cha]
  - id: sent-food-008
    yue: 蘿蔔糕要煎香啲先好食。
    en: "Turnip cake is best pan-fried until fragrant."
