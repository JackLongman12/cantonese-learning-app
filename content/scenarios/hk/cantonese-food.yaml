# Cantonese food: dim sum, siu mei, cha chaan teng, congee and noodles, tong sui,
# Macau snacks, tastes and cooking. Dish names match the food flashcards.
# Drafted by an LLM; reviewed: false until the owner confirms wording and readings.
scenario:
  id: scn-cantonese-food
  title: Cantonese food
  region: both
  tags: [food]

defaults: {register: spoken, source: llm, region: both}

sentences:
  # --- yum cha ---------------------------------------------------------------------
  - id: sent-food-001
    yue: 今個星期日一齊去飲茶好唔好？
    en: "Shall we go for yum cha together this Sunday?"
    tags: [yum-cha]
  - id: sent-food-002
    yue: 飲茶一定要叫蝦餃同燒賣。
    en: "At yum cha you have to order har gow and siu mai."
    tags: [yum-cha]
  - id: sent-food-003
    yue: 呢度啲蝦餃皮好薄。
    en: "The har gow skins here are really thin."
    tags: [yum-cha]
  - id: sent-food-004
    yue: 我想叫一籠叉燒包。
    en: "I'd like a basket of char siu bao."
    tags: [yum-cha]
  - id: sent-food-005
    yue: 鳳爪蒸得好腍。
    en: "The chicken feet are steamed really soft."
    tags: [yum-cha]
