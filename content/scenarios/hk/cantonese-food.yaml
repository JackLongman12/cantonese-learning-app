    yue: 唔該加水。
    en: "More hot water for the tea, please."
    notes: "Leaving the teapot lid open also asks for more water."
    tags: [yum-cha]
  - id: sent-food-015
    yue: 我哋要個點心紙。
    en: "Can we have an order sheet for dim sum?"
    tags: [yum-cha]
  - id: sent-food-016
    yue: 啲點心仲未嚟。
    en: "The dim sum still hasn't come."
    tags: [yum-cha]
  - id: sent-food-017
    yue: 呢籠係咪我哋㗎？
    en: "Is this basket ours?"
    tags: [yum-cha]
  - id: sent-food-018
    yue: 馬拉糕好鬆軟。
    en: "The Malay sponge cake is light and fluffy."
    tags: [yum-cha]
  - id: sent-food-019
    yue: 早啲去，唔係冇位。
    en: "Go early or there won't be seats."
