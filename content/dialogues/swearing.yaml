# Conversations for the swearing topic: when swearing is friendly, when it starts trouble,
# and how people tone it down. Drafted by an LLM; reviewed: false until the owner approves.
scenario: scn-swearing
dialogues:
  - id: dlg-sw-01
    title: "Old friends meet (friendly swearing)"
    lines:
      - ["朋友", "喂，你條仆街終於嚟喇！", "Hey, you bastard, finally here!"]
      - ["你", "塞車呀，冇計。", "Traffic, nothing I could do."]
      - ["朋友", "成日都係你最遲。", "You're always the last one."]
      - ["你", "收皮啦，請你飲嘢得未？", "Give it a rest, I'll buy you a drink, OK?"]
      - ["朋友", "好嘢！", "Hell yeah!"]
  - id: dlg-sw-02
    title: "Watching football"
    lines:
      - ["朋友", "屌！咁都射唔入？", "Fuck! How did he miss that?"]
      - ["你", "佢今日真係柒到爆。", "He's been a total idiot today."]
      - ["朋友", "教練都唔知做乜鬼。", "The coach has no idea what he's doing either."]
      - ["你", "頂唔順，我去攞啤酒。", "Can't take it, I'm getting a beer."]
  - id: dlg-sw-03
    title: "Someone cuts in line"
    lines:
      - ["路人", "喂，你打尖呀！", "Hey, you're cutting in line!"]
      - ["你", "唔好意思，我唔知有人排緊。", "Sorry, I didn't know people were queuing."]
      - ["路人", "你黐線㗎？咁長條人龍睇唔到？", "Are you crazy? You can't see that long line?"]
      - ["你", "講嘢斯文啲啦，我而家去排囉。", "Watch your language, I'm going to line up now."]
  - id: dlg-sw-04
    title: "Reading a forum post"
    lines:
      - ["朋友", "你睇吓呢個留言，句句都有粗口。", "Look at this comment, swearing in every line."]
      - ["你", "DLLM係咩意思？", "What does DLLM mean?"]
      - ["朋友", "即係屌你老母，好粗㗎。", "It's 屌你老母, very rude."]
      - ["你", "噉on9呢？", "And on9?"]
      - ["朋友", "戇鳩囉，都係鬧人蠢。", "戇鳩, calling someone stupid."]
  - id: dlg-sw-05
    title: "Kids are listening"
    lines:
      - ["朋友", "屌，又落雨！", "Fuck, raining again!"]
      - ["你", "喂，細路仔喺度呀。", "Hey, there are kids here."]
      - ["朋友", "唔好意思，頂！又落雨。", "Sorry. Damn! Raining again."]
      - ["你", "好啲喇。", "That's better."]
  - id: dlg-sw-06
    title: "Chewed out by the boss"
    lines:
      - ["同事", "做咩你個樣咁衰？", "Why the long face?"]
      - ["你", "頭先俾老細屌咗成個鐘。", "The boss just chewed me out for an hour."]
      - ["同事", "又係份報告？", "The report again?"]
      - ["你", "係呀，佢話我鳩做。", "Yeah, he says I did it any old how."]
      - ["同事", "唔好理佢，放工飲啤酒。", "Forget him. Beer after work."]
  - id: dlg-sw-07
    title: "Stuck in traffic"
    lines:
      - ["你", "屌，又塞車！", "Fuck, traffic again!"]
      - ["朋友", "冷靜啲，嬲都冇用。", "Calm down, getting angry won't help."]
      - ["你", "我九點要到，而家八點五十喇。", "I have to be there at nine, and it's ten to."]
      - ["朋友", "咁打個電話話遲啲到囉。", "Then call and say you'll be late."]
      - ["你", "頂，又要俾人鬧。", "Damn, I'm getting told off again."]
  - id: dlg-sw-08
    title: "Toning it down at dinner"
    lines:
      - ["朋友", "呢間嘢好撚好食！", "This place is fucking delicious!"]
      - ["你", "細聲啲，隔籬枱有阿婆。", "Keep it down, there's an old lady at the next table."]
      - ["朋友", "哦，好鬼好食。", "Oh, right. Bloody delicious."]
      - ["你", "仲係有個鬼字。", "There's still a 鬼 in it."]
      - ["朋友", "好好食，得未？", "Very delicious. Happy now?"]
