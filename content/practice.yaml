    fill:
      埋單: the bill
      走冰: no ice
      少甜: less sweet
      講慢啲: speak slower
      筷子: chopsticks
      匙羹: a spoon
  - id: fr-go
    zh: 我想去＿
    en: "I want to go to ___."
    fill:
      機場: the airport
      酒店: the hotel
      碼頭: the ferry pier
      超市: the supermarket
      街市: the wet market
      醫院: the hospital
  - id: fr-price
    zh: ＿幾錢？
    en: "How much is ___?"
    fill:
      呢個: this one
      車費: the fare
      蝦餃: the shrimp dumplings
      燒賣: the siu mai
      奶茶: a milk tea
  - id: fr-hurts
    zh: 我＿痛
    en: "My ___ hurts."
    fill:
      頭: head
      肚: belly
      喉嚨: throat
      牙: tooth
      腳: foot

challenges:
  - {id: ch-morning, zh: 早晨, en: "Say 早晨 to a neighbor, a guard or a shopkeeper before noon.", sit: sit-basics}
  - {id: ch-thanks, zh: 唔該, en: "Say 唔該 when someone serves you or holds a door.", sit: sit-basics}
  - {id: ch-squeeze, zh: 唔該借借, en: "Get past someone in a crowd with 唔該借借.", sit: sit-polite}
  - {id: ch-slow, zh: 唔該講慢啲, en: "When someone talks too fast, ask them to slow down.", sit: sit-basics}
  - {id: ch-where, zh: 洗手間喺邊？, en: "Ask a stranger where something is with ＿喺邊？.", sit: sit-around}
  - {id: ch-table, zh: 兩位, en: "At a restaurant, answer 幾多位？ with your number, like 兩位.", sit: sit-food}
  - {id: ch-noice, zh: 走冰, en: "Order a cold drink without ice: say 走冰.", sit: sit-cafe}
  - {id: ch-lesssweet, zh: 少甜, en: "Order a milk tea or lemon tea 少甜.", sit: sit-cafe}
  - {id: ch-takeaway, zh: 拎走, en: "Order food to take away: say 拎走.", sit: sit-food}
  - {id: ch-bill, zh: 唔該埋單, en: "Ask for the bill with 唔該埋單.", sit: sit-food}
  - {id: ch-price, zh: 幾錢？, en: "Ask the price of something at a market stall.", sit: sit-pay}
  - {id: ch-bag, zh: 唔要膠袋, en: "Turn down a plastic bag at the checkout.", sit: sit-pay}
  - {id: ch-tasty, zh: 好好食, en: "Tell the server or cook the food was 好好食.", sit: sit-food}
  - {id: ch-dimsum, zh: 蝦餃, en: "At dim sum, order 蝦餃 or 燒賣 yourself.", sit: sit-dimsum}
  - {id: ch-getoff, zh: 前面有落, en: "On a minibus, call out 前面有落 to get off at the next stop.", sit: sit-around}
  - {id: ch-weather, zh: 今日好熱, en: "Chat about the weather: 今日好熱呀 or 今日好凍.", sit: sit-weather}
  - {id: ch-bye, zh: 唔該晒, en: "Leave a shop with 唔該晒 or 拜拜.", sit: sit-basics}
  - {id: ch-repeat, zh: 再講一次, en: "Didn't catch it? Ask them to say it again.", sit: sit-basics}
