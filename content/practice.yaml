    en: "Where's ___?"
    fill:
      洗手間: the toilet
      地鐵站: the metro station
      巴士站: the bus stop
      出口: the exit
      銀行: the bank
      便利店: a convenience store
      藥房: a pharmacy
      醫院: the hospital
  - id: fr-want
    zh: 我想要＿
    en: "I'd like ___."
    fill:
      呢個: this one
      凍檸茶: an iced lemon tea
      奶茶: a milk tea
      咖啡: a coffee
      水: some water
      收據: a receipt
  - id: fr-have
    zh: 有冇＿？
    en: "Do you have ___?"
    fill:
