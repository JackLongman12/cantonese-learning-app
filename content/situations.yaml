# Newcomer mode (2026-11-17): situations for people new to Cantonese, each a deck of
# essential words and short chunks, not whole sentences. The aim is getting the point
# across with a few keywords ("洗手間喺邊？" or just "洗手間？"), not perfect speech.
# Each word: [Cantonese, English, optional tip]. The English mirrors the Cantonese unit:
# a single word gets a single word ("want" for 要, not "I want it"); a phrase gets a phrase. Readings come from the dictionaries
# (`duk build`); never type Jyutping here. Card ids are `card:<situation>:<word>` and are
# permanent: don't rename a situation id or change a word's characters once shipped
# (add a new word instead).
# Drafted by an LLM; the owner accepted LLM content as-is on 2026-11-16.
situations:
