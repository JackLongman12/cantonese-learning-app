      - [二, "two (the number)", "For counting: 一、二、三."]
      - [兩, "two (of something)", "兩個 = two of them; 兩點 = two o'clock."]
      - [三, "three"]
      - [四, "four"]
      - [五, "five"]
      - [六, "six"]
      - [七, "seven"]
      - [八, "eight"]
      - [九, "nine"]
      - [十, "ten"]
      - [一百, "a hundred"]
      - [幾點, "what time?"]
      - [半, "half", "三點半 = half past three."]
      - [而家, "now"]
      - [今日, "today"]
      - [聽日, "tomorrow"]
      - [尋日, "yesterday"]
      - [星期, "week / day of the week", "星期一 = Monday, 星期日 = Sunday."]
      - [分鐘, "minute(s)"]
      - [一個鐘, "one hour"]

