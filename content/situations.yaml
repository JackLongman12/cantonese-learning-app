# Newcomer mode (2026-11-17): situations for people new to Cantonese, each a deck of
# essential words and short chunks, not whole sentences. The aim is getting the point
# across with a few keywords ("洗手間喺邊？" or just "洗手間？"), not perfect speech.
# Each word: [Cantonese, English, optional tip]. Readings come from the dictionaries
# (`duk build`); never type Jyutping here. Card ids are `card:<situation>:<word>` and are
# permanent: don't rename a situation id or change a word's characters once shipped
# (add a new word instead).
# Drafted by an LLM; the owner accepted LLM content as-is on 2026-11-16.
situations:
  - id: sit-basics
    title: First words
    icon: waving
    description: "Please, thank you, sorry, yes, no: the words you'll use every day."
    words:
      - [唔該, "please / thanks (for help)", "For a favour, a service, or squeezing past someone."]
      - [多謝, "thank you (for a gift)", "For gifts and compliments."]
      - [唔好意思, "excuse me / sorry"]
      - [對唔住, "sorry"]
      - [你好, "hello"]
      - [早晨, "good morning"]
      - [拜拜, "bye"]
      - [係, "yes (it is)"]
      - [唔係, "no (it isn't)"]
      - [好, "OK / good"]
      - [要, "I want it"]
      - [唔要, "I don't want it"]
      - [冇問題, "no problem"]
      - [唔緊要, "never mind / it's OK"]
      - [我唔明, "I don't understand"]
      - [講慢啲, "speak slower"]
      - [再講一次, "say it again"]
      - [識唔識講英文, "do you speak English?"]

