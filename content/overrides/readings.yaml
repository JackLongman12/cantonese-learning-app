# Word-level reading overrides, applied by longest match before any per-sentence fix.
# One reading per character. Add an entry only when the reading is certain wherever the
# word appears; otherwise pin it on the sentence with fix_yue / fix_cmn.
#
# These entries settle cases where the two automatic sources disagree and a standard
# dictionary reading is clear. The owner can change any of them; that is the point of
# keeping them in one file.
yue:
  # sentence-final and question particles (most common value; pin exceptions per sentence)
  呀: [aa3]
  㗎: [gaa3]
  # demonstrative 呢 "this" is ni1; the final particle 呢 is ne1
  呢個: [ni1, go3]
  呢啲: [ni1, di1]
  呢度: [ni1, dou6]
  呢邊: [ni1, bin1]
  呢架: [ni1, gaa3]
  呢間: [ni1, gaan1]
  呢條: [ni1, tiu4]
  呢張: [ni1, zoeng1]
  呢隻: [ni1, zek3]
  呢件: [ni1, gin6]
  呢班: [ni1, baan1]
  呢排: [ni1, paai4]
  # 行 "to walk" is haang4 in speech
  行路: [haang4, lou6]
  點行: [dim2, haang4]
  直行: [zik6, haang4]
  行去: [haang4, heoi3]
  行過: [haang4, gwo3]
  行到: [haang4, dou3]
  搭: [daap3]
