name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check duk tests
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # content.db is a build output: build it so the app compiles. CI has none of the
      # downloaded reference data (dictionary, maps, food pages), so the screen tests
      # that read real content run on the dev machine before each release; CI runs the
      # analyzer and the pure-Dart engine and platform tests.
      - run: pip install -e pipeline
      - run: python -m duk build && python -m duk bundle --no-audio
      - run: mkdir -p app/assets/content/audio app/assets/characters app/assets/cards
      - working-directory: app
        run: flutter pub get && flutter analyze && flutter test test/engine test/events test/platform
