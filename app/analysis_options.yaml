include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    avoid_dynamic_calls: true   # a dynamic call on an enum getter slipped past once
    prefer_const_constructors: true
    unawaited_futures: true
